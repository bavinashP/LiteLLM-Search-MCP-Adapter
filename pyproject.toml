[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm-search-mcp-adapter"
version = "0.1.0"
description = "A standalone, dynamically refreshed MCP Streamable HTTP adapter for LiteLLM Search Tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.31,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
litellm-search-mcp-adapter = "adapter.main:main"

[tool.setuptools.packages.find]
include = ["adapter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.uv]
required-version = "==0.13.8"
