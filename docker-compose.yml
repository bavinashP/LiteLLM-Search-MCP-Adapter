services:
  litellm-search-mcp-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-search-mcp-adapter:0.1.0
    container_name: litellm-search-mcp-adapter
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8088:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
